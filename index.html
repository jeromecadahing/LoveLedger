<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ours — money between us</title>
<meta name="theme-color" content="#1D2540">
<meta name="apple-mobile-web-app-title" content="Ours">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1D2540; --muted:#5D6580; --line:#DCE0EA; --paper:#F3F5F9; --card:#FFFFFF;
  --gbp:#22665A; --gbp-soft:#DCEDE8; --php:#B9761A; --php-soft:#F7E9D2;
  --danger:#B3261E; --btn:#1D2540; --btn-ink:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EBF4; --muted:#A0A7BD; --line:#2E3550; --paper:#141829; --card:#1C2136;
    --gbp:#6CC4B2; --gbp-soft:#173A35; --php:#EDB25A; --php-soft:#3D2D12;
    --danger:#FF8A80; --btn:#E8EBF4; --btn-ink:#141829; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EBF4; --muted:#A0A7BD; --line:#2E3550; --paper:#141829; --card:#1C2136;
  --gbp:#6CC4B2; --gbp-soft:#173A35; --php:#EDB25A; --php-soft:#3D2D12;
  --danger:#FF8A80; --btn:#E8EBF4; --btn-ink:#141829; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,.num{font-family:"Bricolage Grotesque",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 120px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gbp);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--muted);font-size:.9rem}

/* Hero: the balance as a sentence per currency */
.hero{margin:6px 0 26px}
.owe{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
.owe:last-child{border-bottom:0}
.owe .flag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:999px;margin-bottom:6px}
.owe.gbp .flag{background:var(--gbp-soft);color:var(--gbp)}
.owe.php .flag{background:var(--php-soft);color:var(--php)}
.owe p{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(1.55rem,6.5vw,2.1rem);line-height:1.15;font-weight:600;letter-spacing:-.015em}
.owe .amt{font-weight:800}
.owe.gbp .amt{color:var(--gbp)} .owe.php .amt{color:var(--php)}
.owe.even p{color:var(--muted);font-weight:400}

.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:.92rem}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}

h2{font-size:1rem;font-weight:600;color:var(--muted);margin:22px 0 8px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.row{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:13px 16px 13px 10px;text-align:left;background:none;border:0}
.tick,.tickspace{flex:none;width:44px;height:44px;margin-left:8px}
.tick{background:none;border:0;padding:0;display:grid;place-items:center}
.tick span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:800;color:transparent}
.tick[aria-pressed="true"] span{background:var(--gbp);border-color:var(--gbp);color:var(--card)}
.item.settled .row{opacity:.55}
.item.settled .row .who,.item.settled .row .money b{text-decoration:line-through}
.row .who{font-weight:600}
.row .meta{color:var(--muted);font-size:.86rem;grid-column:1}
.row .money{grid-row:1/3;grid-column:2;align-self:center;text-align:right}
.row .money b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;display:block}
.row .money small{font-size:.75rem;color:var(--muted)}
.row.gbp .money b{color:var(--gbp)} .row.php .money b{color:var(--php)}
.tag{font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}

.bankrow{display:flex;justify-content:space-between;align-items:baseline;padding:13px 16px;border-top:1px solid var(--line)}
.bankrow:first-child{border-top:0}
.bankrow .vals{text-align:right;font-family:"Bricolage Grotesque",sans-serif}
.bankrow .vals span{display:block}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:15px 30px;font-weight:700;font-size:1rem;box-shadow:0 6px 20px rgba(20,24,41,.25)}
.fab[hidden]{display:none}

/* Sheet */
dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:min(560px,100%);max-width:100%;max-height:92vh;border-radius:20px 20px 0 0;margin:auto auto 0}
dialog::backdrop{background:rgba(10,12,22,.5)}
.sheet{padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:92vh}
.sheet h3{font-family:"Bricolage Grotesque",sans-serif;margin:0 0 14px;font-size:1.3rem}
label{display:block;font-size:.88rem;font-weight:600;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{resize:vertical;min-height:60px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--ink)}
.seg.cur button[data-v="GBP"][aria-pressed="true"]{border-color:var(--gbp);color:var(--gbp);box-shadow:inset 0 0 0 1px var(--gbp)}
.seg.cur button[data-v="PHP"][aria-pressed="true"]{border-color:var(--php);color:var(--php);box-shadow:inset 0 0 0 1px var(--php)}
.dir{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.dir .p{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center;font-weight:600}
.dir button{border:1px solid var(--line);background:var(--card);border-radius:999px;width:42px;height:42px;font-size:1.1rem}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;color:var(--ink)}
.choice b{display:block;font-weight:600}
.choice span{display:block;font-size:.85rem;color:var(--muted)}
.choice[aria-pressed="true"]{background:var(--card);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.amountrow{display:grid;grid-template-columns:auto 1fr;gap:8px}
.amountrow .seg button{padding:10px 14px}
.result{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--gbp-soft);color:var(--gbp);font-weight:600}
.result.php{background:var(--php-soft);color:var(--php)}
.result:empty{display:none}
.actions{display:flex;gap:10px;margin-top:22px}
.primary{flex:1;background:var(--btn);color:var(--btn-ink);border:0;border-radius:12px;padding:14px;font-weight:700}
.secondary{background:none;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:600}
.del{background:none;border:0;color:var(--danger);font-weight:600;padding:14px 4px}
.err{color:var(--danger);font-size:.88rem;margin-top:10px;min-height:1em}
.signin{text-align:center;padding:12vh 8px 0}
.signin h1{font-size:clamp(2rem,9vw,2.8rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 12px}
.signin p{color:var(--muted);margin:0 auto 26px;max-width:32ch}
.signin .primary{flex:none;padding:14px 26px}
[hidden]{display:none!important}
.installbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px;margin-bottom:16px;font-size:.92rem}
.installbar button{background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:8px 16px;font-weight:700}
.notice{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:.9rem;margin-bottom:16px}
@media (prefers-reduced-motion: no-preference){
  dialog[open]{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<main>
  <div class="installbar" id="installBar" hidden>
    <span>Add Ours to your home screen</span>
    <button type="button" id="installBtn">Install</button>
  </div>
  <section class="signin" id="signin" hidden>
    <h1>Money between us</h1>
    <p>Sign in with your Google account to see what you and your partner owe each other.</p>
    <button class="primary" id="googleBtn" type="button">Sign in with Google</button>
    <div class="err" id="signinErr"></div>
  </section>
  <div id="app" hidden>
  <div class="top">
    <div class="brand">Ours</div>
    <div style="display:flex;gap:8px">
      <button class="ghost" id="setupBtn">Names</button>
      <button class="ghost" id="signOutBtn">Sign out</button>
    </div>
  </div>
  <div id="notice" class="notice" hidden></div>
  <section class="hero" id="hero" aria-live="polite"></section>

  <div class="tabs" role="group" aria-label="View">
    <button aria-pressed="true" data-tab="history">History</button>
    <button aria-pressed="false" data-tab="banks">By bank</button>
  </div>
  <div id="view"></div>
  </div>
</main>

<button class="fab" id="addBtn" type="button" hidden>Log a transaction</button>

<dialog id="entryDlg">
  <form class="sheet" id="entryForm" method="dialog" novalidate>
    <h3 id="entryTitle">Log a transaction</h3>

    <label for="note" id="noteLabel">What was it for?</label>
    <input id="note" placeholder="e.g. Breakfast at Delight" autocomplete="off" maxlength="200">

    <label>Who paid?</label>
    <div class="seg" id="payerSeg">
      <button type="button" data-v="A" id="payerA" aria-pressed="true"></button>
      <button type="button" data-v="B" id="payerB" aria-pressed="false"></button>
    </div>

    <label>How should it be shared?</label>
    <div class="choices" id="kindSeg">
      <button type="button" class="choice" data-v="split" aria-pressed="true"><b>Split it 50/50</b><span id="dSplit"></span></button>
      <button type="button" class="choice" data-v="loan" aria-pressed="false"><b id="tLoan"></b><span id="dLoan"></span></button>
      <button type="button" class="choice" data-v="repay" aria-pressed="false"><b>Paying back</b><span id="dRepay"></span></button>
    </div>

    <label for="amount">How much was paid?</label>
    <div class="amountrow">
      <div class="seg cur" id="curSeg">
        <button type="button" data-v="GBP" aria-pressed="true" aria-label="Pounds">£</button>
        <button type="button" data-v="PHP" aria-pressed="false" aria-label="Pesos">₱</button>
      </div>
      <input id="amount" inputmode="decimal" placeholder="0.00" autocomplete="off">
    </div>
    <p class="result" id="result" aria-live="polite"></p>

    <label for="bank" id="bankLabel">Paid from which bank?</label>
    <input id="bank" list="bankList" placeholder="e.g. Zopa, Monzo, BDO, GCash" autocomplete="off">
    <datalist id="bankList"></datalist>

    <label for="date">Date</label>
    <input id="date" type="date">

    <div class="err" id="entryErr"></div>
    <div class="actions">
      <button type="button" class="del" id="deleteBtn" hidden>Delete</button>
      <button type="button" class="secondary" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<dialog id="setupDlg">
  <form class="sheet" id="setupForm" method="dialog" novalidate>
    <h3>Who’s sharing this?</h3>
    <label for="nameA">First person</label>
    <input id="nameA" placeholder="Your name" autocomplete="off">
    <label for="nameB">Second person</label>
    <input id="nameB" placeholder="Your wife’s name" autocomplete="off">
    <p class="hint">Both of you see the same names and the same records.</p>
    <div class="err" id="setupErr"></div>
    <div class="actions">
      <button type="button" class="secondary" id="setupCancel">Cancel</button>
      <button type="submit" class="primary">Save names</button>
    </div>
  </form>
</dialog>

<script>
// Install button (Android/Chrome). Runs before the Firebase code so the prompt isn't missed.
(function(){
  let deferred=null;
  const bar=document.getElementById("installBar"), btn=document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferred=e; bar.hidden=false; });
  btn.addEventListener("click", async ()=>{ if(!deferred) return; deferred.prompt(); try{ await deferred.userChoice; }catch(_){} deferred=null; bar.hidden=true; });
  window.addEventListener("appinstalled", ()=>{ bar.hidden=true; });
  if("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc,
  addDoc, setDoc, updateDoc, deleteDoc, deleteField, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, ALLOWED_EMAILS } from "./config.js?v=2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

const $ = s => document.querySelector(s);
const SYM = {GBP:"£", PHP:"₱"};
const state = { names:{A:"",B:""}, entries:[], tab:"history", editingId:null, form:{from:"A", kind:"loan", cur:"GBP"}, unsub:[] };

const fmt = (n,cur) => SYM[cur] + Number(n).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const nm = k => state.names[k] || (k==="A" ? "Person 1" : "Person 2");
const other = k => k==="A" ? "B" : "A";
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k==="text") e.textContent=v; else e.setAttribute(k,v); }
  for(const k of kids) if(k!=null) e.append(k);
  return e;
}
function notice(msg){ const n=$("#notice"); n.hidden=!msg; n.textContent=msg||""; }

/* ---------- rendering ---------- */
function balances(){
  const bal={GBP:0,PHP:0}; // positive = B owes A
  for(const e of state.entries){ if(e.settled) continue; bal[e.currency] += (e.from==="A" ? 1 : -1) * Number(e.amount); }
  return bal;
}
function renderHero(){
  const hero=$("#hero"); hero.replaceChildren();
  const bal=balances();
  for(const cur of ["GBP","PHP"]){
    const v=Math.round(bal[cur]*100)/100;
    const box=el("div",{class:"owe "+cur.toLowerCase()+(v===0?" even":"")});
    box.append(el("span",{class:"flag",text: cur==="GBP" ? "Pounds" : "Pesos"}));
    const p=el("p");
    if(v===0) p.textContent = "All square in " + (cur==="GBP"?"pounds":"pesos") + ".";
    else { const debtor = v>0 ? "B" : "A"; p.append(nm(debtor)+" owes "+nm(other(debtor))+" ", el("span",{class:"amt num",text:fmt(Math.abs(v),cur)})); }
    box.append(p); hero.append(box);
  }
}
function renderHistory(){
  const view=$("#view"); view.replaceChildren();
  if(!state.entries.length){
    view.append(el("div",{class:"list"}, el("div",{class:"empty",text:"Nothing recorded yet. Tap “Log a transaction” when one of you pays for something or pays the other back."})));
    return;
  }
  const sorted=[...state.entries].sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
  let month=null, list=null;
  for(const e of sorted){
    const d=new Date((e.date||today())+"T00:00:00");
    const m=d.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
    if(m!==month){ month=m; view.append(el("h2",{text:m})); list=el("div",{class:"list"}); view.append(list); }
    const item=el("div",{class:"item"+(e.settled?" settled":"")});
    if(e.kind==="repay") item.append(el("span",{class:"tickspace"}));
    else {
      const tick=el("button",{class:"tick",type:"button","aria-pressed":String(!!e.settled),
        "aria-label": e.settled ? "Mark as not paid back" : "Mark as paid back"}, el("span",{text:"✓"}));
      tick.addEventListener("click",()=>toggleSettled(e));
      item.append(tick);
    }
    const row=el("button",{class:"row "+e.currency.toLowerCase(),type:"button","aria-label":"Edit transaction"});
    const total=e.total ?? e.amount;
    const title=e.note || (e.kind==="repay" ? nm(e.from)+" paid "+nm(e.to)+" back" : "Payment");
    const tag=e.kind==="split" ? "Split" : e.kind==="repay" ? "Paid back" : "Paid for "+nm(e.to);
    const who=el("div",{class:"who"}, title, el("span",{class:"tag",text:tag}));
    const day=d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    const paidOff = e.settled ? "paid back "+(e.settledAt ? new Date(e.settledAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "") : null;
    const meta=el("div",{class:"meta",text:[day, nm(e.from)+" paid "+fmt(total,e.currency), e.bank ? "from "+e.bank : null, paidOff].filter(Boolean).join(" · ")});
    const money=el("div",{class:"money"}, el("b",{text:fmt(e.amount,e.currency)}), el("small",{text: e.kind==="repay" ? "paid back" : nm(e.to)+" owes"}));
    row.append(who,money,meta);
    row.addEventListener("click",()=>openEntry(e));
    item.append(row);
    list.append(item);
  }
}
function renderBanks(){
  const view=$("#view"); view.replaceChildren();
  if(!state.entries.length){ view.append(el("div",{class:"list"},el("div",{class:"empty",text:"Bank totals show up once you add something."}))); return; }
  for(const person of ["A","B"]){
    const totals={};
    for(const e of state.entries.filter(x=>x.from===person)){
      const b=(e.bank||"Bank not set").trim(); totals[b] ??= {GBP:0,PHP:0}; totals[b][e.currency]+=Number(e.total ?? e.amount);
    }
    view.append(el("h2",{text:"Money that left "+nm(person)+"’s accounts"}));
    const list=el("div",{class:"list"});
    const keys=Object.keys(totals).sort();
    if(!keys.length) list.append(el("div",{class:"empty",text:"Nothing yet."}));
    for(const b of keys){
      const vals=el("div",{class:"vals"});
      for(const cur of ["GBP","PHP"]) if(totals[b][cur]) vals.append(el("span",{text:fmt(totals[b][cur],cur)}));
      list.append(el("div",{class:"bankrow"}, el("span",{text:b}), vals));
    }
    view.append(list);
  }
}
function render(){
  renderHero();
  state.tab==="banks" ? renderBanks() : renderHistory();
  const banks=[...new Set(state.entries.map(e=>(e.bank||"").trim()).filter(Boolean))].sort();
  $("#bankList").replaceChildren(...banks.map(b=>el("option",{value:b})));
}

/* ---------- entry sheet ---------- */
function setSeg(seg,val){ seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===val))); }
const parseAmount=()=>parseFloat(String($("#amount").value).replace(/,/g,""));
const owedFor=(kind,total)=> kind==="split" ? Math.round(total*50)/100 : Math.round(total*100)/100;
function syncForm(){
  const {from:p, kind, cur}=state.form, o=other(p);
  $("#payerA").textContent=nm("A"); $("#payerB").textContent=nm("B");
  setSeg($("#payerSeg"),p); setSeg($("#kindSeg"),kind); setSeg($("#curSeg"),cur);
  $("#dSplit").textContent=nm(o)+" owes half";
  $("#tLoan").textContent="Paid for "+nm(o);
  $("#dLoan").textContent=nm(o)+" owes the full amount";
  $("#dRepay").textContent=nm(p)+" is paying "+nm(o)+" back";
  $("#noteLabel").textContent = kind==="repay" ? "Note (optional)" : "What was it for?";
  $("#note").placeholder = kind==="repay" ? "e.g. For last week’s groceries" : "e.g. Breakfast at Delight";
  $("#bankLabel").textContent="Which of "+nm(p)+"’s banks did it come from?";
  const total=parseAmount(), r=$("#result");
  r.className="result "+cur.toLowerCase();
  if(!(total>0)) r.textContent="";
  else if(kind==="repay") r.textContent="Takes "+fmt(total,cur)+" off what "+nm(p)+" owes "+nm(o);
  else r.textContent=nm(o)+" owes "+nm(p)+" "+fmt(owedFor(kind,total),cur);
}
function openEntry(e){
  state.editingId = e ? e.id : null;
  state.form = e ? {from:e.from, kind:e.kind, cur:e.currency} : {from:state.form.from||"A", kind:"split", cur:state.form.cur};
  $("#entryTitle").textContent = e ? "Edit transaction" : "Log a transaction";
  $("#amount").value = e ? (e.total ?? e.amount) : "";
  $("#bank").value = e ? (e.bank||"") : "";
  $("#date").value = e ? (e.date||today()) : today();
  $("#note").value = e ? (e.note||"") : "";
  $("#deleteBtn").hidden = !e;
  $("#entryErr").textContent="";
  syncForm();
  $("#entryDlg").showModal();
}
for(const [id,key] of [["#payerSeg","from"],["#kindSeg","kind"],["#curSeg","cur"]]){
  $(id).onclick=ev=>{ const b=ev.target.closest("button"); if(!b) return; state.form[key]=b.dataset.v; syncForm(); };
}
$("#amount").addEventListener("input",syncForm);
$("#cancelBtn").onclick=()=>$("#entryDlg").close();
$("#addBtn").onclick=()=>{ if(!state.names.A||!state.names.B) openSetup(); else openEntry(null); };

function toggleSettled(e){
  const owed=fmt(e.amount,e.currency), what=e.note ? "“"+e.note+"”" : "this";
  if(!e.settled){
    if(!confirm("Mark "+what+" as paid back?\n"+nm(e.to)+" has paid "+nm(e.from)+" "+owed+".")) return;
    fireAndForget(updateDoc(doc(db,"entries",e.id),{settled:true, settledAt:Date.now()}));
  } else {
    if(!confirm("Mark "+what+" as not paid back yet?")) return;
    fireAndForget(updateDoc(doc(db,"entries",e.id),{settled:false, settledAt:deleteField()}));
  }
}

function writeError(err){
  if(err?.code==="permission-denied") return "This account isn’t allowed to change the tracker.";
  return "Couldn’t save just now. Check your connection and try again.";
}
// Writes resolve once the server confirms; offline they are queued and sync later, so close the sheet straight away.
function fireAndForget(p, errEl){ p.catch(err=>{ notice(writeError(err)); }); }

$("#entryForm").addEventListener("submit", ev=>{
  ev.preventDefault();
  const total=parseAmount(), kind=state.form.kind, note=$("#note").value.trim().slice(0,200);
  if(kind!=="repay" && !note){ $("#entryErr").textContent="Add what it was for, like “Breakfast”."; $("#note").focus(); return; }
  if(!(total>0) || total>=1e7){ $("#entryErr").textContent="Enter how much was paid."; $("#amount").focus(); return; }
  const data={ from:state.form.from, to:other(state.form.from), kind, currency:state.form.cur,
    total:Math.round(total*100)/100, amount:owedFor(kind,total),
    bank:$("#bank").value.trim().slice(0,60), date:$("#date").value||today(), note };
  if(state.editingId){
    const old=state.entries.find(x=>x.id===state.editingId);
    const keep = old?.settled ? {settled:true, settledAt:old.settledAt||Date.now()} : {};
    fireAndForget(setDoc(doc(db,"entries",state.editingId), {...data, ...keep, createdAt:old?.createdAt||Date.now()}));
  } else {
    fireAndForget(addDoc(collection(db,"entries"), {...data, createdAt:Date.now()}));
  }
  $("#entryDlg").close();
});
$("#deleteBtn").onclick=()=>{
  if(!state.editingId || !confirm("Delete this entry? This can’t be undone.")) return;
  fireAndForget(deleteDoc(doc(db,"entries",state.editingId)));
  $("#entryDlg").close();
};

/* ---------- names ---------- */
function openSetup(){ $("#nameA").value=state.names.A; $("#nameB").value=state.names.B; $("#setupErr").textContent=""; $("#setupDlg").showModal(); }
$("#setupBtn").onclick=openSetup;
$("#setupCancel").onclick=()=>$("#setupDlg").close();
$("#setupForm").addEventListener("submit", ev=>{
  ev.preventDefault();
  const A=$("#nameA").value.trim().slice(0,30), B=$("#nameB").value.trim().slice(0,30);
  if(!A||!B){ $("#setupErr").textContent="Add both names."; return; }
  fireAndForget(setDoc(doc(db,"settings","names"), {A,B}));
  $("#setupDlg").close();
});

/* ---------- tabs ---------- */
document.querySelector(".tabs").onclick=ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  state.tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
};

/* ---------- auth ---------- */
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });
$("#googleBtn").onclick = async ()=>{
  $("#signinErr").textContent="";
  try { await signInWithPopup(auth, provider); }
  catch(err){
    if(err?.code==="auth/popup-blocked" || err?.code==="auth/operation-not-supported-in-this-environment") await signInWithRedirect(auth, provider);
    else if(err?.code!=="auth/popup-closed-by-user" && err?.code!=="auth/cancelled-popup-request") $("#signinErr").textContent="Sign-in didn’t finish (" + (err?.code || err?.message || "unknown error") + "). Try again.";
  }
};
getRedirectResult(auth).catch(()=>{});
$("#signOutBtn").onclick=()=>signOut(auth);

function stopListening(){ state.unsub.forEach(u=>u()); state.unsub=[]; state.entries=[]; state.names={A:"",B:""}; }

onAuthStateChanged(auth, user=>{
  stopListening();
  notice("");
  if(!user){ $("#signin").hidden=false; $("#app").hidden=true; $("#addBtn").hidden=true; return; }
  const email=(user.email||"").toLowerCase();
  if(!ALLOWED_EMAILS.map(e=>e.toLowerCase()).includes(email)){
    signOut(auth);
    $("#signinErr").textContent = email+" isn’t on the list for this tracker. Sign in with the account you set up.";
    return;
  }
  $("#signin").hidden=true; $("#app").hidden=false; $("#addBtn").hidden=false;
  render();
  state.unsub.push(onSnapshot(doc(db,"settings","names"), s=>{
    const d=s.exists() ? s.data() : null;
    state.names={A:d?.A||"",B:d?.B||""};
    render();
    if(!d && !s.metadata.fromCache && !$("#setupDlg").open) openSetup();
  }, err=>notice(err?.code==="permission-denied" ? "This account can’t read the tracker. Check the email list in your Firestore rules." : "Lost connection. Your changes will sync when you’re back online.")));
  state.unsub.push(onSnapshot(collection(db,"entries"), s=>{
    state.entries=s.docs.map(d=>({id:d.id, ...d.data()})).filter(e=>SYM[e.currency] && e.amount>0);
    render();
  }, ()=>{}));
});
</script>
</body>
</html>
